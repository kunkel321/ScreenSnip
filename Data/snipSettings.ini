; ==============================================================================
; snipSettings.ini  —  user settings for ScreenSnip.ahk and its add-on modules
;                       version date -- 8-28-2026 
; ==============================================================================
; Edit with SettingsManager.exe (recommended) or any text editor.
; Explanations for every key live in  snipSettingsMetadata.json  — not here.
;
; Conventions:
;   Booleans are 1 (on) / 0 (off).
;   Colors are 6 hex digits, RRGGBB, with no 0x and no # prefix.
;   `n in a text value means "line break" (the script converts it).
;   Relative paths are resolved against the ScreenSnip.ahk folder.
; ==============================================================================

[Capture]
SelectionColor=B58500
SelectionOverlayAlpha=80
CaptureAdjustMargin=250

[DimensionLabels]
ShowDimensionLabels=1
InfoFontSize=10
InfoWHOffsetRight=38
InfoWHOffsetBottom=25
InfoWMinWidth=75
InfoHMinHeight=55

[FreezeCapture]
FreezeCaptureKey=CapsLock
FreezeDoublePress=1
FreezeDoublePressTime=400
FreezeNullifyCapsLock=1

[FreezeHint]
ShowFreezeHint=1
FreezeHintText=ScreenSnip has frozen the screen.`nRight-click-drag to select a region.`n`nThe new snip will "float" above the screen.`n`nEsc cancels.
FreezeHintTextWinDetect=ScreenSnip has frozen the screen.`nLeft-click a highlighted window to grab it whole,`nor right-click-drag to select any region.`n`nThe new snip will "float" above the screen.`n`nEsc cancels.
FreezeHintFontName=Segoe UI
FreezeHintFontSize=15
FreezeHintTextColor=FFFFFF
FreezeHintBackColor=1E1E1E
FreezeHintAlpha=185
FreezeHintCornerRadius=70

[SnipWindow]
ShowSnipBorder=1
BorderColor=B58500
BorderThickness=2
Bevel3D=1
Bevel3DMaxThickness=3
Bevel3DStrength=0.55
Bevel3DInactiveStrength=0.55
Bevel3DInactiveDarknessFactor=0.2
TransColor=FF00FF

[SnipShadow]
ShowSnipShadow=1
ShadowColor=000000
ShadowOffset=5
ShadowOffsetInactive=3
ShadowBlur=4
ShadowAlpha=105

[Gestures]
PanDragDivisor=3
PanClickSlop=5
EdgeGrabZone=6

[Straighten]
StraightenStep=1
StraightenFineStep=0.5
StraightenMaxAngle=15

[Saving]
SaveDefaultFolder=%USERPROFILE%\Pictures
SaveDefaultExt=png

[Tooltips]
EnhanceToolTips=1
TipFontName=Segoe UI
TipFontSize=12
TipFontStyle=
TipBackColor=1E1E1E
TipTextColor=FFFFFF
TipMarginL=10
TipMarginT=8
TipMarginR=10
TipMarginB=8
TipTitle=
TipTitleIcon=4

[SnipOCR]
OcrPaddleExe=Resources\PaddleOCR-json\PaddleOCR-json.exe
OcrLangConfig=models\config_en.txt
OcrUpscale=3
OcrLimitSideLen=0
OcrMaxSideLen=6144
OcrRotateFill=FFFFFF
OcrMinScore=0.0
OcrMarkBelow=0.0
OcrRowTol=0.60
OcrColTol=1.20
OcrReflow=1
OcrReflowRatio=1.8
OcrReflowAnchorCol=1
OcrReflowGapFactor=1.8
OcrNotATableWarn=0.60
OcrDebug=0

[SnipAI]
AiModel=gpt-5.6
AiDetail=high
AiMaxSide=2048
AiResolveTimeout=10000
AiConnectTimeout=10000
AiSendTimeout=60000
AiReceiveTimeout=180000
AiWaitSecs=180
AiGroundWithOcr=1
AiNormalizeTablePunct=1
AiDashCellToEmpty=0
AiShowTokenUsage=0
AiDebug=0

[SnipImgur]
ImgurConfirmBeforeUpload=1
ImgurDefaultFormat=BBCode [img]
ImgurProgressDelayMs=500
ImgurResolveTimeout=8000
ImgurConnectTimeout=10000
ImgurSendTimeout=30000
ImgurReceiveTimeout=60000

[SnipWinDetect]
WinDetectEnabled=1
WinDetectColor=1E90FF
WinDetectThickness=5
WinDetectPollMs=40
WinDetectMinSize=16
WinDetectShowInfo=1
WinDetectTipIndex=18
WinDetectIncludeDesktop=0
WinDetectIncludeMonitors=1

[Puzzle]
GridCols=4
GridRows=4
MaxBoardSize=0
MinBoardSize=300
TileGap=2
ShowNumbers=1
SlideAnimMs=90
ShuffleMoves=0
BoardColor=707070
TileOutline=1
SelectColor=FFC24B
CloseSnipOnStart=0
SoundOnSolve=1
AlwaysOnTop=1

[Jigsaw]
PieceCount=48
MaxBoardSize=0
MinBoardSize=280
CanvasScale=180
SnapPixels=0
KnobDepth=22
PieceOutline=1
ShowBoardOutline=1
FeltColor=728CA7
SoundOnSnap=1
SoundOnSolve=1
AlwaysOnTop=1
CloseSnipOnStart=0

[Markup]
Color=E81123
FillColor=FFFFFF
FillShapes=0
Thickness=3
FontName=Segoe UI
FontSize=18
Outline=1
OutlineWidth=2
Shadow=0
ShadowOffset=2
ShadowAlpha=110
HighlightAlpha=90
ArrowHeadScale=4.0
Pixelate=1
BlurAmount=10
HandleSize=7
HandleColor=00A2FF
UndoDepth=60
PaletteAutoShow=1
PaletteGap=1
PathTurnTolerance=14
PathCornerRadius=7
PathMaxSegments=24