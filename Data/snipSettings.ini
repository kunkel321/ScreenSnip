[MarkupCaps]
; User-defined arrowheads. Name, then:
;   poly or circle, then fill or open or line, then shrink, then coordinates.
; fill is a solid shape, open is a stroked outline, line is an unclosed stroke.
; The tip sits at 0,0 with +x running back along the shaft, in head-lengths.
; shrink is how far back the shaft stops so no nub shows through the cap.
; poly takes x,y pairs; circle takes a centre distance and a radius.
; Delete these two once you have your own; they are only here as examples.
Fletch=poly, fill, 0.90, 0,0, 1,-0.60, 0.60,0, 1,0.60
Ring=circle, open, 0.76, 0.38, 0.38

[MarkupDashes]
; User-defined dash patterns. Lengths alternate on, off, on, off, and each is
; a multiple of the stroke width, so a pattern holds its proportions at any
; line weight. Every number must be greater than zero.
Railroad=5, 2, 1, 2
Sparse=1, 4

